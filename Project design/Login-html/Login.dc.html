<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        #f7f6f3;
      color: #17171a;
      --accent: oklch(58% 0.16 258); --danger: oklch(56% 0.19 25); --line: #1c1c1f; --sub: #6b6f76; --note: #a3785a;
    }
    a { color: var(--accent); text-decoration: none; }
    .devtag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--note); background: #fbf3ea; border: 1px dashed #d8b898; border-radius: 4px; padding: 2px 7px; display: inline-block; }
    input { font-family: inherit; font-size: 14px; }
    input::placeholder { color: #a3a6ab; }
  </style>
</helmet>
<div style="width:420px;height:680px;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:340px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:36px 32px;position:relative;">

    <span class="devtag" style="position:absolute;top:14px;right:14px;">canActivate guard</span>

    <sc-if value="{{signedIn}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center;padding:40px 0;">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="font-weight:600;font-size:15px;">Signed in</div>
        <div style="color:var(--sub);font-size:13px;margin-top:4px;">Redirecting to /dashboard…</div>
      </div>
    </sc-if>

    <sc-if value="{{!signedIn}}" hint-placeholder-val="{{true}}">
    <div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:28px;">
        <div style="width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="10" width="4" height="8" rx="1" fill="#fff"></rect><rect x="8" y="6" width="4" height="12" rx="1" fill="#fff"></rect><rect x="14" y="2" width="4" height="16" rx="1" fill="#fff"></rect></svg>
        </div>
        <span style="font-weight:700;font-size:16px;">Ledger</span>
      </div>

      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-weight:600;font-size:17px;">Welcome back</div>
        <div style="color:var(--sub);font-size:13px;margin-top:4px;">Sign in to your budget tracker</div>
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;">Email</label>
        <input type="email" placeholder="you@email.com" value="{{email}}" onInput="{{onEmail}}" style="width:100%;padding:10px 12px;border:1.5px solid {{emailBorder}};border-radius:6px;outline:none;">
        <sc-if value="{{showErrors}}" hint-placeholder-val="{{false}}">
          <sc-if value="{{emailInvalid}}" hint-placeholder-val="{{true}}">
            <div style="color:var(--danger);font-size:11.5px;margin-top:5px;">Enter a valid email address</div>
          </sc-if>
        </sc-if>
      </div>

      <div style="margin-bottom:8px;">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;">Password</label>
        <div style="position:relative;">
          <input type="{{pwType}}" placeholder="••••••••" value="{{password}}" onInput="{{onPassword}}" style="width:100%;padding:10px 36px 10px 12px;border:1.5px solid {{pwBorder}};border-radius:6px;outline:none;">
          <button onClick="{{togglePw}}" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--sub);padding:4px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <sc-if value="{{showErrors}}" hint-placeholder-val="{{false}}">
          <sc-if value="{{pwInvalid}}" hint-placeholder-val="{{true}}">
            <div style="color:var(--danger);font-size:11.5px;margin-top:5px;">Password is required</div>
          </sc-if>
        </sc-if>
      </div>

      <button onClick="{{submit}}" style="width:100%;margin-top:12px;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Sign in</button>

      <div style="text-align:center;margin-top:18px;font-size:12.5px;color:var(--sub);">No account? <a href="#">Sign up</a></div>
    </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', password: '', showPw: false, showErrors: false, signedIn: false };
  }
  renderVals() {
    const s = this.state;
    const emailInvalid = !s.email || !s.email.includes('@');
    const pwInvalid = !s.password;
    return {
      email: s.email,
      password: s.password,
      pwType: s.showPw ? 'text' : 'password',
      showErrors: s.showErrors,
      emailInvalid,
      pwInvalid,
      emailBorder: (s.showErrors && emailInvalid) ? 'oklch(56% 0.19 25)' : '#1c1c1f',
      pwBorder: (s.showErrors && pwInvalid) ? 'oklch(56% 0.19 25)' : '#1c1c1f',
      signedIn: s.signedIn,
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      submit: () => {
        const emailInvalid2 = !this.state.email || !this.state.email.includes('@');
        const pwInvalid2 = !this.state.password;
        if (emailInvalid2 || pwInvalid2) { this.setState({ showErrors: true }); }
        else { this.setState({ signedIn: true }); }
      }
    };
  }
}
</script>
</body>
</html>
