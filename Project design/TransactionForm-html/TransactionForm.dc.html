<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        #f7f6f3;
      color: #17171a;
      --accent: oklch(58% 0.16 258); --danger: oklch(56% 0.19 25); --ok: oklch(62% 0.13 150);
      --line: #1c1c1f; --sub: #6b6f76; --note: #a3785a;
    }
    .devtag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--note); background: #fbf3ea; border: 1px dashed #d8b898; border-radius: 4px; padding: 2px 7px; display: inline-block; }
    input, select, textarea { font-family: inherit; font-size: 13.5px; }
    input::placeholder, textarea::placeholder { color: #a3a6ab; }
  </style>
</helmet>
<div style="width:420px;height:680px;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:360px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:24px;max-height:640px;overflow:auto;">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div style="font-weight:600;font-size:15px;">Add transaction</div>
      <button style="background:none;border:none;cursor:pointer;color:var(--sub);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="margin-bottom:16px;"><span class="devtag">FormGroup + Validators.required / .min(0.01)</span></div>

    <sc-if value="{{success}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center;padding:48px 0;">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="font-weight:600;font-size:14.5px;">Transaction saved</div>
        <div style="color:var(--sub);font-size:12.5px;margin-top:4px;">TransactionService.save() &rarr; back to /transactions</div>
        <button onClick="{{reset}}" style="margin-top:20px;background:none;border:1.5px solid var(--line);border-radius:6px;padding:8px 14px;font-size:12.5px;cursor:pointer;">Add another</button>
      </div>
    </sc-if>

    <sc-if value="{{!success}}" hint-placeholder-val="{{true}}">
    <div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button onClick="{{pickExpense}}" style="flex:1;padding:9px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid {{expenseBorder}};background:{{expenseBg}};color:{{expenseColor}};">Expense</button>
        <button onClick="{{pickIncome}}" style="flex:1;padding:9px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid {{incomeBorder}};background:{{incomeBg}};color:{{incomeColor}};">Income</button>
      </div>

      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;">Amount</label>
        <div style="position:relative;">
          <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13.5px;">$</span>
          <input placeholder="0.00" value="{{amount}}" onInput="{{onAmount}}" style="width:100%;padding:9px 11px 9px 24px;border:1.5px solid {{amountBorder}};border-radius:6px;outline:none;"/>
        </div>
        <sc-if value="{{amountError}}" hint-placeholder-val="{{false}}">
          <div style="color:var(--danger);font-size:11px;margin-top:5px;">Enter an amount greater than $0</div>
        </sc-if>
      </div>

      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;">Merchant / description</label>
        <input placeholder="e.g. Whole Foods Market" value="{{merchant}}" onInput="{{onMerchant}}" style="width:100%;padding:9px 11px;border:1.5px solid {{merchantBorder}};border-radius:6px;outline:none;"/>
        <sc-if value="{{merchantError}}" hint-placeholder-val="{{false}}">
          <div style="color:var(--danger);font-size:11px;margin-top:5px;">Add a merchant or description</div>
        </sc-if>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div>
          <label style="display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;">Category</label>
          <select style="width:100%;padding:9px 8px;border:1.5px solid var(--line);border-radius:6px;">
            <option>Groceries</option><option>Rent</option><option>Transport</option>
            <option>Entertainment</option><option>Utilities</option><option>Other</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;">Date</label>
          <input type="date" value="2026-09-09" style="width:100%;padding:9px 8px;border:1.5px solid var(--line);border-radius:6px;outline:none;"/>
        </div>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;">Notes (optional)</label>
        <textarea placeholder="Anything worth remembering&hellip;" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;outline:none;resize:none;"></textarea>
      </div>

      <div style="display:flex;gap:8px;">
        <button style="flex:1;background:none;border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
        <button onClick="{{save}}" style="flex:1;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;">Save</button>
      </div>
    </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'expense', amount: '', merchant: '', showErrors: false, success: false };
  }
  renderVals() {
    const s = this.state;
    const amountNum = parseFloat(s.amount);
    const amountError = s.showErrors && (!s.amount || isNaN(amountNum) || amountNum <= 0);
    const merchantError = s.showErrors && !s.merchant.trim();
    return {
      expenseBorder: s.type === 'expense' ? 'oklch(58% 0.16 258)' : '#d8d5cf',
      expenseBg: s.type === 'expense' ? 'oklch(58% 0.16 258)' : '#fff',
      expenseColor: s.type === 'expense' ? '#fff' : '#17171a',
      incomeBorder: s.type === 'income' ? 'oklch(58% 0.16 258)' : '#d8d5cf',
      incomeBg: s.type === 'income' ? 'oklch(58% 0.16 258)' : '#fff',
      incomeColor: s.type === 'income' ? '#fff' : '#17171a',
      pickExpense: () => this.setState({ type: 'expense' }),
      pickIncome: () => this.setState({ type: 'income' }),
      amount: s.amount,
      onAmount: (e) => this.setState({ amount: e.target.value }),
      amountBorder: amountError ? 'oklch(56% 0.19 25)' : '#1c1c1f',
      amountError,
      merchant: s.merchant,
      onMerchant: (e) => this.setState({ merchant: e.target.value }),
      merchantBorder: merchantError ? 'oklch(56% 0.19 25)' : '#1c1c1f',
      merchantError,
      success: s.success,
      reset: () => this.setState({ amount: '', merchant: '', showErrors: false, success: false }),
      save: () => {
        const st = this.state;
        const n = parseFloat(st.amount);
        const bad = !st.amount || isNaN(n) || n <= 0 || !st.merchant.trim();
        if (bad) this.setState({ showErrors: true });
        else this.setState({ success: true, showErrors: false });
      }
    };
  }
}
</script>
</body>
</html>
