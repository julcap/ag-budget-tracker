<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(23,23,26,0.05) 24px),
        #f7f6f3;
      color: #17171a;
      --accent: oklch(58% 0.16 258); --danger: oklch(56% 0.19 25);
      --line: #1c1c1f; --sub: #6b6f76; --card: #ffffff; --note: #a3785a;
    }
    a { color: var(--accent); text-decoration: none; }
    .devtag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--note); background: #fbf3ea; border: 1px dashed #d8b898; border-radius: 4px; padding: 2px 7px; display: inline-block; }
    .navlink { font-size: 14px; font-weight: 500; color: var(--sub); cursor: pointer; padding: 6px 2px; border-bottom: 2px solid transparent; }
    .navlink.active { color: #17171a; border-bottom: 2px solid var(--accent); font-weight: 600; }
    input, select { font-family: inherit; font-size: 13px; }
  </style>
</helmet>
<div style="width:1280px;height:880px;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1.5px solid var(--line);background:#fff;">
    <div style="display:flex;align-items:center;gap:36px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="10" width="4" height="8" rx="1" fill="#fff"></rect><rect x="8" y="6" width="4" height="12" rx="1" fill="#fff"></rect><rect x="14" y="2" width="4" height="16" rx="1" fill="#fff"></rect></svg>
        </div>
        <span style="font-weight:700;font-size:16px;">Ledger</span>
      </div>
      <nav style="display:flex;gap:28px;">
        <span class="navlink">Dashboard</span>
        <span class="navlink">Transactions</span>
        <span class="navlink">Budgets</span>
        <span class="navlink active" style="display:flex;align-items:center;gap:4px;">Settings
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </span>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:30px;height:30px;border-radius:50%;background:#e4e2dd;border:1.5px solid var(--line);"></div>
    </div>
  </div>

  <div style="padding:28px 32px;overflow:auto;flex:1;max-width:640px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;">
      <h1 style="font-size:20px;margin:0;">Settings</h1>
      <span class="devtag">Route: /settings, canActivate: [authGuard]</span>
    </div>

    <div style="background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:14px;">Profile</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
          <label style="display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;">Name</label>
          <input value="Jordan Avery" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;outline:none;">
        </div>
        <div>
          <label style="display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;">Email</label>
          <input value="jordan@example.com" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;outline:none;">
        </div>
      </div>
    </div>

    <div style="background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:14px;">Preferences</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="font-size:13px;">Currency</div>
        <select style="padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;">
          <option>USD ($)</option>
          <option>EUR (€)</option>
          <option>DKK (kr)</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;">Theme</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);background:{{swatch}};"></div>
          <button onClick="{{toggleTheme}}" style="display:flex;align-items:center;background:#efeee9;border-radius:14px;padding:2px;width:46px;cursor:pointer;border:1.5px solid var(--line);">
            <div style="width:18px;height:18px;border-radius:50%;background:var(--accent);transition:margin .15s;margin-left:{{knob}};"></div>
          </button>
          <span style="font-size:12px;color:var(--sub);width:34px;">{{themeLabel}}</span>
        </div>
      </div>
    </div>

    <div style="background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:10px;">Security</div>
      <button style="background:none;border:1.5px solid var(--line);border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;">Change password</button>
    </div>

    <div style="border:1.5px solid var(--danger);border-radius:8px;padding:20px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:4px;color:var(--danger);">Danger zone</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:12px;">Deleting your account removes all transactions and budgets.</div>
      <button style="background:none;border:1.5px solid var(--danger);color:var(--danger);border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;">Delete account</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    const dark = this.state.dark;
    return {
      swatch: dark ? '#17171a' : '#ffffff',
      knob: dark ? '22px' : '2px',
      themeLabel: dark ? 'Dark' : 'Light',
      toggleTheme: () => this.setState({ dark: !this.state.dark })
    };
  }
}
</script>
</body>
</html>
