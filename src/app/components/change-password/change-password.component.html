<div class="settings-row">
  <div class="setting-info">
    <span class="setting-label">Password</span>
    @if (saved()) { <span class="setting-hint" role="status">Password updated.</span> }
  </div>
  <button type="button" class="btn btn-ghost btn-small" (click)="toggle()">{{ open() ? 'Cancel' : 'Change password' }}</button>
</div>
@if (open()) {
  <form class="inline-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password" />
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label for="changePassword">New password</label>
        <input id="changePassword" type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <div class="form-error">At least 6 characters</div>
        }
      </div>
      <div class="form-group">
        <label for="changeConfirm">Confirm</label>
        <input id="changeConfirm" type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
          <div class="form-error">Passwords don't match</div>
        }
      </div>
    </div>
    @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
    <button type="submit" class="btn btn-primary" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Update password' }}</button>
  </form>
}
