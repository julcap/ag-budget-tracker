<section class="page">
  <div class="page-header">
    <h1>Budgets &amp; categories</h1>
  </div>

  <div class="budget-grid">
    @for (b of budgets(); track b.id) {
      <div class="budget-card">
        <div class="budget-card-header">
          <div>
            <div class="budget-name">{{ b.name }}</div>
            <div class="budget-meta">{{ b.spent | currency }} of {{ b.limit | currency }} budget</div>
          </div>
          <div class="budget-actions">
            <span class="status-badge status-{{ statusClass(b) }}">{{ statusLabel(b) }}</span>
            <button class="icon-btn" (click)="toggleEdit(b.id)" aria-label="Edit budget">✎</button>
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill fill-{{ statusClass(b) }}" [style.width.%]="progressPct(b)"></div>
        </div>

        @if (editingId() === b.id) {
          <div class="edit-row">
            <span class="edit-label">Monthly budget $</span>
            <input
              class="edit-input"
              type="number"
              [value]="draftLimit()"
              (input)="onDraftInput($event)"
            />
            <button class="btn btn-primary" (click)="saveLimit(b.id)">Save</button>
            <button class="btn btn-ghost" (click)="toggleEdit(b.id)">Cancel</button>
          </div>
        }
      </div>
    }
  </div>
</section>
