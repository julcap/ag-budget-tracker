<section class="page">
  <div class="page-header"><h1>Settings</h1></div>

  <div class="settings-card">
    <div class="settings-title">Profile</div>
    <div class="settings-row">
      <label>Name</label>
      <input value="Jordan Avery" />
    </div>
    <div class="settings-row">
      <label>Email</label>
      <input value="jordan@example.com" />
    </div>
  </div>

  <div class="settings-card">
    <div class="settings-title">Preferences</div>
    <div class="settings-row">
      <span>Theme</span>
      <button
        type="button"
        class="theme-toggle"
        role="switch"
        aria-label="Dark mode"
        [attr.aria-checked]="theme() === 'dark'"
        [class.is-dark]="theme() === 'dark'"
        (click)="toggleTheme()"
      >
        <span class="theme-option" aria-hidden="true">Light</span>
        <span class="theme-option" aria-hidden="true">Dark</span>
      </button>
    </div>
  </div>
</section>
