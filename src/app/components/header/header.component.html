<header class="app-header">
  <a routerLink="/dashboard" class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="10" width="4" height="8" rx="1" fill="#fff"/>
        <rect x="8" y="6" width="4" height="12" rx="1" fill="#fff"/>
        <rect x="14" y="2" width="4" height="16" rx="1" fill="#fff"/>
      </svg>
    </span>
    <span class="brand-name">Ledger</span>
  </a>

  <nav class="nav-links" aria-label="Main">
    @for (link of links(); track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link">{{ link.label }}</a>
    }
  </nav>

  <div class="header-right">
    <a routerLink="/settings" class="user-avatar" [title]="displayName()" aria-label="Account settings">
      {{ initials() }}
    </a>
    <button type="button" class="logout-btn" (click)="logout()">Log out</button>
  </div>
</header>
