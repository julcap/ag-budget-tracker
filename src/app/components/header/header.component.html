<header class="app-header">
  <div class="header-left">
    <a routerLink="/dashboard" class="brand">
      <div class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="10" width="4" height="8" rx="1" fill="#fff"/>
          <rect x="8" y="6" width="4" height="12" rx="1" fill="#fff"/>
          <rect x="14" y="2" width="4" height="16" rx="1" fill="#fff"/>
        </svg>
      </div>
      <span class="brand-name">Ledger</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
      <a routerLink="/transactions" routerLinkActive="active" class="nav-link">Transactions</a>
      <a routerLink="/budgets" routerLinkActive="active" class="nav-link">Budgets</a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-link">
        Settings
        <svg class="lock-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </a>
    </nav>
  </div>

  <div class="header-right">
    <div class="user-avatar" title="Jordan Avery"></div>
    <button type="button" class="logout-btn" (click)="logout()" title="Log out">
      Log out
    </button>
  </div>
</header>
