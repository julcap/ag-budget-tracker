<div class="balance-card">
  <div class="card-label">{{ label() }}</div>
  <div class="card-value-wrapper">
    <div class="card-value" [class.color-ok]="valueColor() === 'ok' || trend() === 'up'">
      {{ value() }}
    </div>
    @if (trend() === 'up') {
      <svg class="trend-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 6l-9.5 9.5-5-5L1 18"></path>
        <path d="M17 6h6v6"></path>
      </svg>
    }
  </div>
</div>
