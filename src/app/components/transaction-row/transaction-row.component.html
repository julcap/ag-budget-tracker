<button type="button" class="transaction-item" (click)="edit.emit(transaction().id)">
  <span class="transaction-main">
    <span class="merchant-name">{{ transaction().merchant }}</span>
    <span class="transaction-meta">
      <span class="category-badge">{{ transaction().category }}</span>
      <span class="date-text">{{ transaction().date | displayDate }}</span>
    </span>
  </span>
  <span class="amount-value" [class.income]="amount() > 0">{{ amount() | money: 'signed' }}</span>
</button>
