<app-auth-card heading="Welcome back" subheading="Sign in to your budget tracker">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" formControlName="username" autocomplete="username" autocapitalize="none" />
      @if (form.controls.username.invalid && form.controls.username.touched) {
        <div class="form-error">Enter your username</div>
      }
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <a routerLink="/forgot-password" class="small-link">Forgot password?</a>
      </div>
      <div class="password-wrapper">
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button type="button" class="password-toggle" (click)="toggleShowPassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <div class="form-error">Password must be at least 6 characters</div>
      }
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
  </form>

  <p class="auth-links">No account? <a routerLink="/register">Create one</a></p>
</app-auth-card>
